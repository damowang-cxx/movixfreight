services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movix
      POSTGRES_PASSWORD: movix
      POSTGRES_DB: movix_freight
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: movix-minio
      MINIO_ROOT_PASSWORD: change-this-before-production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
